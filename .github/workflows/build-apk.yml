name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_platform:
        description: 'Target platform'
        required: false
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos 2>&1 | head -80
        continue-on-error: true

      - name: Build APK
        run: |
          set -o pipefail
          cd android && chmod +x gradlew && cd ..
          flutter build apk \
            --${{ github.event.inputs.build_mode || 'release' }} \
            --target-platform ${{ github.event.inputs.target_platform || 'android-arm64' }} \
            --build-number=${{ github.run_number }} 2>&1 | tee /tmp/build_log.txt || true

      - name: Locate and prepare APK
        run: |
          mkdir -p /tmp/apk-output
          BUILD_MODE="${{ github.event.inputs.build_mode || 'release' }}"
          # Flutter normally puts APK here (symlinked from android/app/build)
          FLUTTER_APK="build/app/outputs/flutter-apk/app-${BUILD_MODE}.apk"
          # Fallback: Gradle output location
          GRADLE_APK="android/app/build/outputs/flutter-apk/app-${BUILD_MODE}.apk"
          # Broadest fallback: search everywhere
          FOUND=""
          for candidate in "$FLUTTER_APK" "$GRADLE_APK"; do
            if [ -f "$candidate" ]; then
              echo "Found APK at: $candidate"
              FOUND="$candidate"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            FOUND=$(find . -name "app-${BUILD_MODE}.apk" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              echo "Found APK via search: $FOUND"
            fi
          fi
          if [ -z "$FOUND" ]; then
            echo "=== Searching all APK files ==="
            find . -name "*.apk" -type f 2>/dev/null || true
            echo "=== Build dirs ==="
            ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No build/app/outputs/flutter-apk/"
            ls -la android/app/build/outputs/flutter-apk/ 2>/dev/null || echo "No android/app/build/outputs/flutter-apk/"
            echo "ERROR: No APK found"
            exit 1
          fi
          cp "$FOUND" /tmp/apk-output/app-release.apk
          echo "APK ready:"
          ls -lh /tmp/apk-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: /tmp/apk-output/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ github.event.inputs.build_mode || 'release' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ github.event.inputs.target_platform || 'android-arm64' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -h /tmp/apk-output/app-release.apk 2>/dev/null | cut -f1)
          echo "- **APK size**: ${APK_SIZE:-N/A}" >> $GITHUB_STEP_SUMMARY
