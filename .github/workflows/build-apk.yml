name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_platform:
        description: 'Target platform'
        required: false
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          cd android && ./gradlew assembleRelease --stacktrace 2>&1 | tail -100

      - name: Find APK
        run: |
          echo "=== Searching for APK files ==="
          find /home/runner/work/radiogo -name "*.apk" 2>/dev/null || echo "No APK found"
          echo "=== Build dir contents ==="
          ls -laR /home/runner/work/radiogo/radiogo/build/ 2>/dev/null || echo "No build dir"
          echo "=== Android build dir ==="
          ls -laR /home/runner/work/radiogo/radiogo/android/build/ 2>/dev/null || echo "No android build dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 90
