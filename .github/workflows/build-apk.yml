name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_platform:
        description: 'Target platform'
        required: false
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          cd android && chmod +x gradlew && cd ..
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-number=${{ github.run_number }}

      - name: Find and upload APK
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p /tmp/apk-output
          cp "$APK_PATH" /tmp/apk-output/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: /tmp/apk-output/app-release.apk
          retention-days: 90

      - name: Build summary
        run: |
          APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: release" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: android-arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Build number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$APK_PATH" ]; then
            echo "- **APK size**: $(du -h "$APK_PATH" | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK path**: $APK_PATH" >> $GITHUB_STEP_SUMMARY
          fi
