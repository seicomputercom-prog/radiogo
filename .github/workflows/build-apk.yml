name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_platform:
        description: 'Target platform'
        required: false
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          cd android && chmod +x gradlew && cd ..
          flutter build apk \
            --${{ github.event.inputs.build_mode || 'release' }} \
            --target-platform ${{ github.event.inputs.target_platform || 'android-arm64' }} \
            --build-number=${{ github.run_number }}
        continue-on-error: true

      - name: Locate and prepare APK
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || true
          echo "=== Directory structure ==="
          ls -la build/ 2>/dev/null || echo "No build/ dir"
          ls -la build/app/outputs/ 2>/dev/null || echo "No build/app/outputs/"
          ls -la build/app/outputs/apk/ 2>/dev/null || echo "No apk/ dir"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No flutter-apk/ dir"
          ls -la android/app/build/outputs/ 2>/dev/null || echo "No android/app/build/outputs/"
          mkdir -p /tmp/apk-output
          APK=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "Found: $APK"
            cp "$APK" /tmp/apk-output/app-release.apk
            ls -lh /tmp/apk-output/
          else
            ANY=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
            if [ -n "$ANY" ]; then
              echo "Using fallback: $ANY"
              cp "$ANY" /tmp/apk-output/app-release.apk
            else
              echo "ERROR: No APK found"
              exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: /tmp/apk-output/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ github.event.inputs.build_mode || 'release' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ github.event.inputs.target_platform || 'android-arm64' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -h /tmp/apk-output/app-release.apk 2>/dev/null | cut -f1)
          echo "- **APK size**: ${APK_SIZE:-N/A}" >> $GITHUB_STEP_SUMMARY
